# CI-1: frontend 는 dependabot 설정이 없어 GitHub Actions/의존성 업데이트가 수동이었다.
# 구조는 mobile/.github/dependabot.yml 을 그대로 따른다 —
# 3rd-party action 은 SHA pin 대신 dependabot 자동 갱신,
# first-party `actions/*` 는 major tag float 유지(관리 부담 회피).
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github-actions']
    # 이 레포가 쓰는 3rd-party action: oven-sh/setup-bun, docker/*, github/codeql-action.
    # 아래 first-party `actions/*` 만 ignore (mobile 과 동일 정책).
    ignore:
      - dependency-name: 'actions/checkout'
      - dependency-name: 'actions/cache'
      - dependency-name: 'actions/upload-artifact'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
    # bun.lock 처리가 이 레포에서 확인되기 전까지는 2 로 낮춰 둔다 (확인 후 5 로 상향).
    open-pull-requests-limit: 2
    labels: ['dependencies', 'npm']
    # ⚠️ 이 레포의 lockfile 은 `bun.lock` 하나뿐이다(package-lock.json / yarn.lock 없음).
    # dependabot 의 npm ecosystem 이 bun lockfile 을 읽는다고 알려져 있으나 이 레포에서
    # 실제로 확인된 적은 없다 — 첫 실행 후 Insights > Dependency graph > Dependabot 의
    # 마지막 실행 로그와 첫 PR 이 bun.lock 을 갱신하는지 반드시 확인할 것.
    # 못 읽으면 이 블록은 조용히 no-op 이거나 lockfile 미갱신 PR 을 만든다.
    ignore:
      # Capacitor 계열은 mobile/package.json 과 **문자열까지 동일**해야 하고, 그 SoT 는
      # mobile 이다 (mobile/scripts/check-capacitor-sync.mjs, frontend pre-commit 에서 실행).
      # 여기서 단독 bump PR 이 열리면 정합 게이트에 걸려 mobile 을 손으로 맞추기 전까지
      # 머지가 막힌다 — 항상 빨간 PR 이 쌓이므로 아예 열지 않는다.
      # Capacitor 업그레이드는 mobile 에서 시작해 frontend 를 같은 값으로 따라 올린다.
      - dependency-name: '@capacitor/*'
      - dependency-name: '@capacitor-community/*'
